name: Validate Home Assistant Git Sync
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r ha_git_sync/requirements.txt
      - run: python -m unittest discover -s ha_git_sync/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ha_git_sync/tests/test_frontend.cjs
      - name: Build and verify Home Assistant image metadata
        run: |
          build_version="$(python -c 'import yaml; print(yaml.safe_load(open("ha_git_sync/config.yaml"))["version"])')"
          docker build --build-arg BUILD_VERSION="$build_version" --build-arg BUILD_ARCH=amd64 -t ha-git-sync:test ha_git_sync
          test "$(docker image inspect ha-git-sync:test --format '{{ index .Config.Labels "io.hass.version" }}')" = "$build_version"
          test "$(docker image inspect ha-git-sync:test --format '{{ index .Config.Labels "io.hass.arch" }}')" = "amd64"
          test "$(docker image inspect ha-git-sync:test --format '{{ index .Config.Labels "io.hass.type" }}')" = "app"
