name: Validate Home Assistant Git Sync
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r ha_git_sync/requirements.txt
      - run: python -m unittest discover -s ha_git_sync/tests -v
      - run: docker build -t ha-git-sync:test ha_git_sync
